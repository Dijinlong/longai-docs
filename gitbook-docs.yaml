$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: LONG AI Docs
  structure:
    - type: space
      key: space-docs
      title: Documentation
      path: docs
      default: true
      content:
        directory: ./docs
    - type: space
      key: space-changelog
      title: Changelog
      path: changelog
      content:
        directory: ./changelog
    - type: space
      key: space-mcp
      title: MCP
      path: mcp
      content:
        directory: ./mcp